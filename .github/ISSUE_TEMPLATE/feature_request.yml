name: Feature request
description: Suggest an improvement to VisualMD
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Research or visualization use case
      description: Describe the task this would help you complete.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
